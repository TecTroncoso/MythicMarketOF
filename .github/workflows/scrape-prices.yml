name: Scrape supplier prices

# Runs the game's price scraper and imports the results into Turso.
# Triggers:
#   - workflow_dispatch from the admin panel (/admin/precios) on Vercel
#     (serverless cannot spawn Python), or manually from the Actions tab.
#   - schedule: daily at 06:00 UTC so storefront prices track the supplier
#     even without a human clicking the button.

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game id (lib/supplier-games.ts)
        required: false
        default: "mlbb"
        type: choice
        options:
          - mlbb
  schedule:
    # 06:00 UTC = 03:00 Buenos Aires / 08:00 Madrid — store fresh before business.
    - cron: "0 6 * * *"

concurrency:
  # One scrape at a time: the provider (ScrapingAnt free tier) caps concurrency.
  group: scrape-supplier-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Los secrets viven en el environment "production" del repo; sin esta
    # línea el job no hereda sus valores (llegan vacíos).
    environment: production
    env:
      # En schedule no hay inputs de dispatch: el juego por defecto es "mlbb".
      GAME: ${{ inputs.game || 'mlbb' }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          ENEBA_USER_ID: ${{ secrets.ENEBA_USER_ID }}
          ENEBA_ZONE_ID: ${{ secrets.ENEBA_ZONE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          missing=""
          for var in SCRAPINGANT_API_KEY ENEBA_USER_ID ENEBA_ZONE_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Secrets faltantes::Configúralos en Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi
          echo "Todos los secrets requeridos están configurados."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps (scraper)
        run: pip install curl_cffi

      - name: Run MLBB scraper
        if: env.GAME == 'mlbb'
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          ENEBA_USER_ID: ${{ secrets.ENEBA_USER_ID }}
          ENEBA_ZONE_ID: ${{ secrets.ENEBA_ZONE_ID }}
        run: python scrapers/eneba_mlbb.py

      - name: Unsupported game
        if: env.GAME != 'mlbb'
        run: |
          echo "Game '$GAME' has no scraper step in this workflow"
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Node deps (importer)
        run: npm ci

      - name: Import results into Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/import-eneba-prices.ts
