name: Scrape supplier prices

# Runs the game's price scraper and imports the results into Turso.
# Triggered from the admin panel (/admin/precios) via workflow_dispatch when
# the app runs on Vercel (serverless cannot spawn Python). Can also be run
# manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game id (lib/supplier-games.ts)
        required: true
        default: "mlbb"
        type: choice
        options:
          - mlbb

concurrency:
  # One scrape at a time: the provider (ScrapingAnt free tier) caps concurrency.
  group: scrape-supplier-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (scraper)
        run: pip install curl_cffi

      - name: Run MLBB scraper
        if: inputs.game == 'mlbb'
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          ENEBA_USER_ID: ${{ secrets.ENEBA_USER_ID }}
          ENEBA_ZONE_ID: ${{ secrets.ENEBA_ZONE_ID }}
        run: python scrapers/eneba_mlbb.py

      - name: Unsupported game
        if: inputs.game != 'mlbb'
        run: |
          echo "Game '${{ inputs.game }}' has no scraper step in this workflow"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps (importer)
        run: npm ci

      - name: Import results into Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/import-eneba-prices.ts
